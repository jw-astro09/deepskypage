<main class="container">
    <section class="editor" aria-labelledby="form-title">
        <h1 id="form-title">DEEP SKY 글 작성</h1>
        <label for="category">분류</label>
        <select id="category">
            <option value="천체 관측 데이터">천체 관측 데이터</option>
            <option value="실험 보고서">실험 보고서</option>
            <option value="훈련 자료">훈련 자료</option>
            <option value="소스 코드">소스 코드</option>
            <option value="기타">기타</option>
        </select>

        <label for="post-title">제목</label>
        <input id="post-title" type="text" maxlength="160" aria-label="글 제목" placeholder="제목을 입력하세요">

        <label>첨부 링크</label>
        <div id="link-container"></div>
        <button id="add-link" class="btn" type="button">링크 추가</button>

        <label for="file-input">파일 첨부</label>
        <input id="file-input" type="file" multiple aria-label="첨부 파일">
        <div id="upload-progress-wrap" hidden>
            <progress id="upload-progress" max="100" value="0"></progress>
            <div><span id="upload-status" role="status"></span><button id="cancel-upload" class="btn" type="button">업로드 취소</button></div>
        </div>

        <label for="post-content">내용</label>
        <textarea id="post-content" maxlength="20000" aria-label="글 내용" placeholder="내용을 입력하세요"></textarea>
        <div><span id="draft-status" role="status"></span><button id="clear-draft" class="btn" type="button" hidden>임시 저장 삭제</button></div>

        <div class="actions">
            <button id="cancel-btn" class="btn" type="button">취소</button>
            <button id="submit-btn" class="btn btn-primary" type="button">등록</button>
        </div>
    </section>
</main>
