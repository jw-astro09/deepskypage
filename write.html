<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="logo.png" type="image/png">
    <link rel="apple-touch-icon" href="logo.png">
    <title>DEEP SKY | Write</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/write.css">
</head>
<body>
<div class="auth-bar">
    <a href="index.html" class="logo-link"><img src="logo.png" alt="Logo" class="nav-logo"><span>DEEP SKY</span></a>
    <div class="auth-user-zone"><span id="user-name" style="display:none;"></span><button id="logout-btn" class="auth-btn" style="display:none;">LOGOUT</button></div>
</div>
<div class="container">
    <h1 id="formTitle">새 자료 등록</h1>
    <div class="write-card">
        <label for="category">카테고리</label>
        <select id="category">
            <option value="천체 관측 데이터">천체 관측 데이터</option>
            <option value="기술 문서 / 매뉴얼">기술 문서 / 매뉴얼</option>
            <option value="발표 및 세미나">발표 및 세미나</option>
            <option value="보고서">보고서</option>
            <option value="소프트웨어 및 코드">소프트웨어 및 코드</option>
            <option value="기타">기타</option>
        </select>
        <label for="postTitle">자료 제목</label>
        <input type="text" id="postTitle" placeholder="제목을 입력하세요">
        <div class="link-input-group">
            <p class="field-label">공유 링크 (구글 드라이브 등)</p>
            <div id="linkContainer">
                <div class="link-item">
                    <input type="url" class="postFileUrl" aria-label="공유 링크 주소" placeholder="링크 주소 (https://...)" style="flex:2; margin-bottom:0;">
                    <input type="text" class="postFileName" aria-label="공유 링크 이름" placeholder="이름 (예: 관측자료.zip)" style="flex:1; margin-bottom:0;">
                    <button type="button" id="btnAddLink" style="width:40px; background:var(--accent); color:black; border:none; border-radius:5px; cursor:pointer; font-weight:bold;">+</button>
                </div>
            </div>
        </div>
        <label for="fileInput">첨부파일</label>
        <input type="file" id="fileInput" multiple>
        <p style="margin:-10px 0 20px; color:#888; font-size:13px;">파일 크기 제한 없이 업로드할 수 있습니다. 위험한 실행 파일 형식은 차단됩니다.</p>
        <div id="uploadProgressWrap" class="progress-wrap" hidden><progress id="uploadProgress" max="100" value="0"></progress><div class="section-heading-row"><span id="uploadStatus" class="form-status"></span><button id="cancelUploadBtn" class="btn" type="button">업로드 취소</button></div></div>
        <label for="postContent">설명</label>
        <textarea id="postContent" placeholder="자료에 대한 상세 설명을 입력하세요..."></textarea>
        <div class="section-heading-row"><span id="draftStatus" class="draft-status" role="status"></span><button id="clearDraftBtn" class="btn" type="button" hidden>임시저장 삭제</button></div>
        <button id="submitBtn" class="btn-submit">자료 등록하기</button>
        <button class="btn-cancel" onclick="history.back()">취소</button>
    </div>
</div>
<footer>
  <p>&copy; 2026 DEEP SKY | Bokseong Astronomy and Aerospace Club | All Rights Reserved.</p>
  <p>복성고등학교 천문·항공우주 동아리</p>
  <p>Designed by jw-astro09 | Contact: 2jw5464@gmail.com</p>
</footer>
<script type="module" src="js/write.js"></script>
<script type="module" src="frontend-access-control.js?v=20260828-admin-access"></script>
</body>
</html>
